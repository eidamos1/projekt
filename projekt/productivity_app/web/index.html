<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="productivity_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>productivity_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Auto-apply new deploys without a manual hard refresh (Ctrl+F5).
    //
    // Flutter's service worker already calls skipWaiting() + clients.claim(),
    // so a fresh deploy activates and takes control on the next load — but the
    // page keeps running the OLD main.dart.js in memory until it reloads. So we
    // reload once when a NEW worker takes over.
    //
    // Guard: only when the page was ALREADY controlled at startup. On a
    // first-ever visit there's no controller yet and the initial claim would
    // otherwise trigger a needless reload (or loop).
    if ('serviceWorker' in navigator) {
      if (navigator.serviceWorker.controller) {
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      }
      // Long-open tabs won't re-fetch the worker on their own — re-check for a
      // newer version whenever the tab regains focus. If one exists it installs,
      // takes over, and the listener above reloads.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.update();
          });
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
